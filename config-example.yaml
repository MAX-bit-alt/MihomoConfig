#本配置中删除了很多内核已有默认值 P.S.本人喜欢精简配置
#仅供参考，适合自己的才是最好的
mixed-port: 7890
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
profile: {store-fake-ip: true}

tun:
  enable: true
  stack: mips
  congestion-controller: bbr3
  dns-hijack: [any:53, tcp://any:53]

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - rule-set:private
    - rule-set:fakeip-filter
    - rule-set:geolocation-cn
  nameserver-policy:
    'rule-set:private': [system]
    'rule-set:douyin': [180.184.1.1, 180.184.2.2]
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query

region_select_base: &region_select_base {type: select, proxies: [日本, 香港, 新加坡, 美国]}
select_base: &select_base {type: select, include-all: true}
reject_base: &reject_base {type: select, proxies: [REJECT-DROP, REJECT, PASS]}

filter_hk: &filter_hk
  filter: '(?i)香港|Hong\s*Kong|(?:^|[^A-Za-z])HKG?(?:[^A-Za-z]|$)|🇭🇰'
filter_sg: &filter_sg
  filter: '(?i)新加坡|狮城|Singapore|(?:^|[^A-Za-z])SGP?(?:[^A-Za-z]|$)|🇸🇬'
filter_jp: &filter_jp
  filter: '(?i)日本|Japan|(?:^|[^A-Za-z])JPN?(?:[^A-Za-z]|$)|🇯🇵'
filter_us: &filter_us
  filter: '(?i)美国|United\s*States|(?:^|[^A-Za-z])USA?(?:[^A-Za-z]|$)|🇺🇸'

icon_proxy: &icon_proxy
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png'
icon_telegram: &icon_telegram
icon_advertising: &icon_advertising
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Advertising.png'
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png'
icon_ai: &icon_ai
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png'
icon_ehentai: &icon_ehentai
  icon: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/EHentai.svg'
icon_google: &icon_google
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png'
icon_hk: &icon_hk
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png'
icon_jp: &icon_jp
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png'
icon_sg: &icon_sg
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png'
icon_us: &icon_us
  icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png'

proxy-groups:
  - {name: 默认, <<: [*region_select_base, *icon_proxy]}
  - {name: 广告, <<: [*reject_base, *icon_advertising]}
  - {name: Telegram, <<: [*region_select_base, *icon_telegram], default-selected: 香港}
  - {name: 国外AI, <<: [*region_select_base, *icon_ai], default-selected: 美国}
  - {name: E-Hentai, <<: [*region_select_base, *icon_ehentai], default-selected: 美国}
  - {name: Google, <<: [*region_select_base, *icon_google]}

  - {name: 香港, <<: [*select_base, *filter_hk, *icon_hk]}
  - {name: 新加坡, <<: [*select_base, *filter_sg, *icon_sg]}
  - {name: 日本, <<: [*select_base, *filter_jp, *icon_jp]}
  - {name: 美国, <<: [*select_base, *filter_us, *icon_us]}

rules:
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,geolocation-cn),(RULE-SET,cn_ip,no-resolve)))))),REJECT
  - RULE-SET,category-ads-all,广告
  - RULE-SET,private,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,microsoft@cn,DIRECT
  - RULE-SET,apple@cn,DIRECT
  - RULE-SET,geolocation-cn,DIRECT
  - RULE-SET,google,Google
  - RULE-SET,category-ai-!cn,国外AI
  - RULE-SET,ehentai,E-Hentai
  - RULE-SET,telegram,Telegram
  - RULE-SET,geolocation-!cn,默认

  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,google_ip,Google
  - RULE-SET,cn_ip,DIRECT
  - MATCH,默认

proxy_providers_base: &proxy_providers_base {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.apple.com/library/test/success.html', interval: 600}}

proxy-providers:
  MIO:
    <<: *proxy_providers_base
    url: '' #机场订阅填引号里
    override:
      additional-prefix: 'MIO | '

mrs_rules_ipcidr: &mrs_rules_ipcidr {type: http, interval: 86400, behavior: ipcidr, format: mrs}
mrs_rules_domain: &mrs_rules_domain {type: http, interval: 86400, behavior: domain, format: mrs}

rule-providers:
  fakeip-filter:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/fakeip-filter.mrs'
  category-ads-all:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/category-ads-all.mrs'
  private:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/private.mrs'
  douyin:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/douyin.mrs'
  microsoft@cn:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/microsoft@cn.mrs'
  apple@cn:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/apple@cn.mrs'
  category-ai-!cn:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/category-ai-!cn.mrs'
  telegram:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/telegram.mrs'
  ehentai:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/ehentai.mrs'
  google:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/google.mrs'
  geolocation-cn:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/geolocation-cn.mrs'
  geolocation-!cn:
    <<: *mrs_rules_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/geolocation-!cn.mrs'
  private_ip:
    <<: *mrs_rules_ipcidr
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geoip/private.mrs'
  telegram_ip:
    <<: *mrs_rules_ipcidr
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geoip/telegram.mrs'
  google_ip:
    <<: *mrs_rules_ipcidr
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geoip/google.mrs'
  cn_ip:
    <<: *mrs_rules_ipcidr
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geoip/cn.mrs'
